<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StadiumAI Test Suite</title>
    <style>
        body { font-family: monospace; background: #030308; color: #f1f5f9; padding: 2rem; }
        .pass { color: #10b981; font-weight: bold; }
        .fail { color: #ef4444; font-weight: bold; }
        .test-case { margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <h1>StadiumAI Unit Tests</h1>
    <div id="testResults"></div>

    <script src="translations.js"></script>
    <script src="chat-assistant.js"></script>
    <script>
        const results = document.getElementById('testResults');
        let passed = 0;
        let total = 0;

        function assertEqual(name, actual, expected) {
            total++;
            const div = document.createElement('div');
            div.className = 'test-case';
            if (actual === expected) {
                passed++;
                div.innerHTML = `<span class="pass">✔ PASS:</span> ${name}`;
            } else {
                div.innerHTML = `<span class="fail">✖ FAIL:</span> ${name} <br> Expected: ${expected} <br> Actual: ${actual}`;
            }
            results.appendChild(div);
        }

        function runTests() {
            try {
                // Test HTML escaping
                assertEqual('escapeHTML sanitizes tags', escapeHTML('Hello <b>world</b>'), 'Hello &lt;b&gt;world&lt;/b&gt;');
                assertEqual('escapeHTML sanitizes attributes', escapeHTML('<script src="x.js"><\\/script>'), '&lt;script src=&quot;x.js&quot;&gt;&lt;/script&gt;');

                // Test Chat Assistant logic
                const elevatorEn = getBotResponse('Where is the wheelchair elevator?', 'en');
                assertEqual('Chat understands wheelchair query (EN)', elevatorEn.includes('nearest handicap elevators'), true);

                const veganEs = getBotResponse('Quiero comida vegana', 'es');
                assertEqual('Chat understands vegan query (ES)', veganEs.includes('Las opciones veganas'), true);

                const shuttleFr = getBotResponse('Où est la navette?', 'fr');
                assertEqual('Chat understands shuttle query (FR)', shuttleFr.includes('La navette vers'), true);

            } catch (e) {
                const div = document.createElement('div');
                div.innerHTML = `<span class="fail">Error running tests:</span> ${e.message}`;
                results.appendChild(div);
            }

            const summary = document.createElement('h3');
            summary.innerHTML = `<br>Results: ${passed} / ${total} passed.`;
            results.appendChild(summary);
        }

        window.onload = runTests;
    </script>
</body>
</html>
